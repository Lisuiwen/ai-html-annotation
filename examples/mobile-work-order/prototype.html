<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端工单 · Mobile Work Order</title>
  <link rel="stylesheet" href="./prototype/prototype.css">
</head>
<body>
  <div class="ui-preview" id="uiPreview">

    <!-- ===== 工单列表页 (list) ===== -->
    <section class="mv-list-page" id="listPage" data-page="list" hidden>
      <div class="mv-device-status" aria-hidden="true">
        <span class="mv-device-status__time">9:41</span>
        <span class="mv-device-status__icons">
          <span class="mv-device-status__signal"></span>
          <span class="mv-device-status__wifi"></span>
          <span class="mv-device-status__battery"></span>
        </span>
      </div>
      <header class="mv-nav-bar" data-mv-key="nav-bar">
        <button type="button" class="mv-nav-bar__back" data-mv-key="back" aria-label="返回">
          <span class="mv-nav-bar__back-icon" aria-hidden="true">‹</span>
        </button>
        <h1 class="mv-nav-bar__title" data-mv-key="title">工单列表</h1>
        <button type="button" class="mv-nav-bar__right" data-mv-key="right" id="navNew" data-ui-interactive>新建</button>
      </header>

      <div class="mv-list-page__body">
        <div class="mv-list-page__row">
          <div class="mv-cell" data-mv-key="cell">
            <div class="mv-cell__content">
              <div class="mv-cell__title" id="orderTitle1">打印机卡纸</div>
              <div class="mv-cell__label" id="orderLabel1">设备故障 · 2026-09-10 09:12</div>
            </div>
            <div class="mv-cell__value" id="orderValue1"><span class="mv-tag mv-tag--warning" data-mv-key="tag">处理中</span></div>
            <span class="mv-cell__arrow" aria-hidden="true">›</span>
          </div>
        </div>
        <div class="mv-list-page__row">
          <div class="mv-cell" data-mv-key="cell">
            <div class="mv-cell__content">
              <div class="mv-cell__title" id="orderTitle2">会议室投影仪无信号</div>
              <div class="mv-cell__label" id="orderLabel2">设备故障 · 2026-09-09 15:40</div>
            </div>
            <div class="mv-cell__value" id="orderValue2"><span class="mv-tag mv-tag--success" data-mv-key="tag">已完成</span></div>
            <span class="mv-cell__arrow" aria-hidden="true">›</span>
          </div>
        </div>
        <div class="mv-list-page__row">
          <div class="mv-cell" data-mv-key="cell">
            <div class="mv-cell__content">
              <div class="mv-cell__title" id="orderTitle3">申请开通门禁权限</div>
              <div class="mv-cell__label" id="orderLabel3">权限申请 · 2026-09-08 10:05</div>
            </div>
            <div class="mv-cell__value" id="orderValue3"><span class="mv-tag mv-tag--primary" data-mv-key="tag">待处理</span></div>
            <span class="mv-cell__arrow" aria-hidden="true">›</span>
          </div>
        </div>
      </div>

      <nav class="mv-tab-bar" data-mv-key="tab-bar" role="tablist" aria-label="主导航">
        <button type="button" class="mv-tab-bar__item" data-mv-key="home" role="tab" aria-selected="true">
          <span class="mv-tab-bar__icon" aria-hidden="true">🏠</span>
          <span class="mv-tab-bar__label">首页</span>
        </button>
        <button type="button" class="mv-tab-bar__item" data-mv-key="list" role="tab" aria-selected="false">
          <span class="mv-tab-bar__icon" aria-hidden="true">📋</span>
          <span class="mv-tab-bar__label">工单</span>
        </button>
        <button type="button" class="mv-tab-bar__item" data-mv-key="mine" role="tab" aria-selected="false">
          <span class="mv-tab-bar__icon" aria-hidden="true">👤</span>
          <span class="mv-tab-bar__label">我的</span>
        </button>
      </nav>
    </section>

    <!-- ===== 新建工单页 (form) ===== -->
    <section class="mv-form-page" id="formPage" data-page="form" hidden>
      <div class="mv-device-status" aria-hidden="true">
        <span class="mv-device-status__time">9:41</span>
        <span class="mv-device-status__icons">
          <span class="mv-device-status__signal"></span>
          <span class="mv-device-status__wifi"></span>
          <span class="mv-device-status__battery"></span>
        </span>
      </div>
      <header class="mv-nav-bar" data-mv-key="nav-bar">
        <button type="button" class="mv-nav-bar__back" data-mv-key="back" aria-label="返回">
          <span class="mv-nav-bar__back-icon" aria-hidden="true">‹</span>
        </button>
        <h1 class="mv-nav-bar__title" data-mv-key="title">新建工单</h1>
        <button type="button" class="mv-nav-bar__right" data-mv-key="right">保存</button>
      </header>

      <div class="mv-form-page__group">
        <div class="mv-field" data-mv-key="field">
          <label class="mv-field__label" data-mv-key="label">
            <span class="mv-field__required" aria-hidden="true">*</span>
            标题
          </label>
          <div class="mv-field__body">
            <input
              class="mv-field__input"
              id="formTitle"
              data-mv-key="input"
              type="text"
              placeholder="请输入工单标题"
              value=""
            />
          </div>
          <p class="mv-field__error" data-mv-key="error"></p>
        </div>

        <div class="mv-field" data-mv-key="field">
          <label class="mv-field__label" data-mv-key="label">
            <span class="mv-field__required" aria-hidden="true">*</span>
            描述
          </label>
          <div class="mv-field__body">
            <input
              class="mv-field__input"
              id="formDescription"
              data-mv-key="input"
              type="text"
              placeholder="请描述问题现象"
              value=""
            />
          </div>
          <p class="mv-field__error" data-mv-key="error"></p>
        </div>

        <div class="mv-cell mv-cell--is-link" data-mv-key="cell" id="priorityCell">
          <div class="mv-cell__content">
            <div class="mv-cell__title">紧急程度</div>
          </div>
          <div class="mv-cell__value" id="priorityValue">普通</div>
          <span class="mv-cell__arrow" aria-hidden="true">›</span>
        </div>

        <div class="mv-cell" data-mv-key="cell">
          <div class="mv-cell__content">
            <div class="mv-cell__title" id="urgentTitle">加急处理</div>
          </div>
          <div class="mv-cell__value">
            <button
              type="button"
              class="mv-switch"
              id="urgentSwitch"
              data-mv-key="switch"
              role="switch"
              aria-checked="false"
            >
              <span class="mv-switch__node"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="mv-form-page__submit">
        <button type="button" class="mv-button mv-button--primary mv-button--block" data-mv-key="button" id="submitButton" data-ui-interactive>
          <span class="mv-button__content">提交工单</span>
        </button>
      </div>
    </section>

    <!-- ===== 反馈层 ===== -->
    <div class="mv-dialog" id="submitDialog" data-mv-key="dialog" hidden>
      <div class="mv-dialog__mask" data-mv-key="mask"></div>
      <div class="mv-dialog__surface" role="dialog" aria-modal="true" aria-labelledby="submitDialogTitle">
        <h2 class="mv-dialog__title" id="submitDialogTitle" data-mv-key="title">确认提交</h2>
        <p class="mv-dialog__message" data-mv-key="message">确定提交这条工单吗？</p>
        <div class="mv-dialog__actions">
          <button type="button" class="mv-dialog__button mv-dialog__button--cancel" data-mv-key="cancel">取消</button>
          <button type="button" class="mv-dialog__button mv-dialog__button--confirm" data-mv-key="confirm" id="dialogConfirm">确认</button>
        </div>
      </div>
    </div>

    <div class="mv-toast" id="toast" data-mv-key="toast" role="status" hidden>
      <span class="mv-toast__icon" data-mv-key="icon" aria-hidden="true"></span>
      <p class="mv-toast__message" data-mv-key="message">加载中...</p>
    </div>
  </div>

  <!-- Client Runtime loads explicitly display-mode → state → model → notes viewer; product script then registers the adapter. -->
  <script src="./prototype/notes.snapshot.js"></script>
  <script src="./prototype/display-mode.js"></script>
  <script src="./prototype/state.js"></script>
  <script src="./prototype/model.js"></script>
  <script src="./prototype/viewer.js" data-prototype-notes-viewer></script>
  <script src="./prototype/ui-adapters.js"></script>
  <script src="./prototype/prototype.js"></script>

</body>
</html>
