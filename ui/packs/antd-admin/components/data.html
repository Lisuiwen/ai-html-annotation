<!--
  UI 数据包：需要筛选栏、工具栏、表格、空态、加载态、标签或分页时读取。
  依赖同包 foundation.html；筛选字段可再读取 form provider。
-->
<style>
  /* 筛选栏和工具栏。 */
  .ui-filter, .ui-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--ui-space-3);
  }
  .ui-filter { min-height: var(--ui-filter-height); padding: var(--ui-space-4); background: var(--ui-bg-soft); }
  .ui-toolbar { justify-content: space-between; min-height: var(--ui-toolbar-height); padding-inline: var(--ui-space-4); }
  .ui-toolbar-group { display: flex; align-items: center; gap: var(--ui-space-2); }

  /* 状态标签。 */
  .ui-tag {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 0 var(--ui-space-2);
    color: var(--ui-text-secondary);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-space-1);
    background: var(--ui-bg-soft);
    font-size: var(--ui-font-size-caption);
  }
  .ui-tag--primary { color: var(--ui-primary); border-color: var(--ui-primary); background: var(--ui-bg); }

  /* 表格及其数据状态。 */
  .ui-table-wrap {
    overflow: auto;
    border: 1px solid var(--ui-border-soft);
    border-radius: var(--ui-radius-container);
  }
  .ui-table { width: 100%; min-width: 680px; border-collapse: collapse; }
  .ui-table th, .ui-table td {
    height: var(--ui-table-header-height);
    padding: var(--ui-table-cell-padding);
    text-align: left;
    border-bottom: 1px solid var(--ui-border-soft);
  }
  .ui-table th { font-weight: 600; background: var(--ui-bg-soft); }
  /* ponytail: 表格行 hover 未采集；取得真实状态后替换当前近似。 */
  .ui-table tbody tr:hover { background: var(--ui-bg-soft); }
  .ui-table-state {
    display: none;
    place-items: center;
    min-height: 160px;
    color: var(--ui-text-tertiary);
    text-align: center;
  }
  .ui-table-state.is-active { display: grid; }
  .ui-table-data.is-hidden { display: none; }
  .ui-empty-icon { font-size: 32px; color: var(--ui-text-disabled); }
  /* ponytail: 加载骨架未采集；取得真实 loading 状态后替换当前近似。 */
  .ui-loading-lines { display: grid; width: 180px; gap: var(--ui-space-2); }
  .ui-loading-line { height: var(--ui-table-cell-padding); border-radius: var(--ui-space-1); background: var(--ui-border-soft); }
  .ui-loading-line:nth-child(2) { width: 70%; }

  /* ponytail: 分页行为和状态未采集；当前仅用于原型流程占位。 */
  .ui-pagination {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-top: var(--ui-space-3);
    gap: var(--ui-space-2);
  }
</style>

<!-- 最小列表工作区。 -->
<div class="ui-toolbar" id="uiToolbar">
  <div class="ui-toolbar-group" id="uiToolbarLeft"><button class="ui-button ui-button--primary">新建</button></div>
  <div class="ui-toolbar-group" id="uiToolbarRight" aria-label="表格状态演示">
    <button class="ui-button ui-button--text" data-table-state="data">数据</button>
    <button class="ui-button ui-button--text" data-table-state="empty">空态</button>
    <button class="ui-button ui-button--text" data-table-state="loading">加载</button>
  </div>
</div>
<div class="ui-table-wrap" id="uiTableWrap">
  <table class="ui-table ui-table-data" id="uiDataTable">
    <thead><tr><th>名称</th><th>状态</th><th>操作</th></tr></thead>
    <tbody><tr><td>示例条目</td><td><span class="ui-tag">状态</span></td><td><button class="ui-button ui-button--text">查看</button></td></tr></tbody>
  </table>
  <div class="ui-table-state" id="uiTableEmpty"><div><div class="ui-empty-icon" aria-hidden="true">□</div><div>暂无数据</div></div></div>
  <div class="ui-table-state" id="uiTableLoading" aria-label="正在加载">
    <div class="ui-loading-lines"><span class="ui-loading-line"></span><span class="ui-loading-line"></span></div>
  </div>
</div>

<script>
  /* 切换示例表格的数据、空态和加载态。 */
  function setUiTableState(state) {
    document.getElementById('uiDataTable').classList.toggle('is-hidden', state !== 'data');
    document.getElementById('uiTableEmpty').classList.toggle('is-active', state === 'empty');
    document.getElementById('uiTableLoading').classList.toggle('is-active', state === 'loading');
    window.dispatchEvent(new CustomEvent('ui:layout-change'));
  }

  /* 使用声明式属性连接表格状态按钮。 */
  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-table-state]');
    if (button) setUiTableState(button.dataset.tableState);
  });
</script>
