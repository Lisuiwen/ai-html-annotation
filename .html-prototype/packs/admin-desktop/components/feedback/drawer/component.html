<style>
  /* ponytail: Drawer visuals not captured; replace current approximation with real state when available. */
  .ui-drawer-overlay { justify-content: flex-end; }
  .ui-drawer { width: min(420px, 92vw); height: 100%; background: var(--ui-bg); }
</style>

<!-- Place this structure in the left product area .ui-preview. -->
<button class="ui-button ui-button--primary" id="uiDemoDrawerOpen" type="button" aria-controls="uiDemoDrawer" aria-haspopup="dialog">Open Drawer</button>
<div class="ui-overlay ui-drawer-overlay" id="uiDemoDrawer" role="dialog" aria-modal="true" aria-labelledby="uiDrawerTitle" aria-hidden="true" hidden>
  <!-- Annotation wiring binds to inner panel id ({overlayId}Panel); overlay id is for Adapter / ARIA only. -->
  <aside class="ui-drawer" id="uiDemoDrawerPanel">
    <div class="ui-layer-head">
      <strong id="uiDrawerTitle">Drawer title</strong>
      <button class="ui-button ui-button--icon" id="uiDemoDrawerClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="ui-layer-body">General content area</div>
  </aside>
</div>
