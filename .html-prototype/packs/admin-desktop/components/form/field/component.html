<style>
  .ui-field {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: center;
    min-height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    gap: var(--ui-space-2);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
  }
  .ui-field-label { color: var(--ui-text-secondary); white-space: nowrap; }
  .ui-field > .ui-input,
  .ui-field > .ui-textarea,
  .ui-field .ui-select-trigger,
  .ui-field .ui-date-picker-trigger {
    width: 100%;
    min-width: 0;
    height: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  .ui-field > .ui-textarea {
    min-height: calc(3 * var(--ui-line-height-body));
    padding-block: var(--ui-space-1);
    resize: vertical;
  }
  .ui-field > .ui-select,
  .ui-field > .ui-date-picker { width: 100%; min-width: 0; }
  .ui-field > .ui-switch { flex-shrink: 0; }
  .ui-field .ui-input:focus-visible,
  .ui-field .ui-textarea:focus-visible,
  .ui-field .ui-select-trigger:focus-visible,
  .ui-field .ui-date-picker-trigger:focus-visible { outline: none; }
  /* ponytail: focus visuals not captured; replace current approximation with real focus state when available. */
  .ui-field:focus-within { outline: 2px solid var(--ui-primary); outline-offset: 1px; }
  .ui-required { color: var(--ui-error); }
  /* ponytail: error color, icon, and trigger timing not captured; replace with real validation state when available. */
  .ui-field--error { border-color: var(--ui-primary); box-shadow: 0 0 0 1px var(--ui-primary); }
  .ui-field-error {
    grid-column: 1 / -1;
    color: var(--ui-primary);
    font-size: var(--ui-font-size-caption);
  }
</style>

<div class="ui-field">
  <label class="ui-field-label" for="uiFieldInput">Field label <span class="ui-required" aria-hidden="true">*</span></label>
  <!-- default input enables standalone preview focus; replace with form.input or form.select when composed. -->
  <input class="ui-input" id="uiFieldInput" type="text" placeholder="Please enter">
</div>
