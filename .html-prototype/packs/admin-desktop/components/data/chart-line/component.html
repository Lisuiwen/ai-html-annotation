<style>
  :root { --ui-chart-height: 240px; }
  .ui-chart { display: grid; gap: var(--ui-space-3); min-width: 0; }
  .ui-chart-canvas { width: 100%; height: var(--ui-chart-height); min-height: 160px; }
  .ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-font-size-caption); }
  .ui-chart[data-status="empty"] .ui-chart-data { display: none; }
  .ui-chart[data-status="data"] .ui-chart-empty, .ui-chart[data-status="loading"] .ui-chart-empty { display: none; }
  /* ponytail: tooltip position, zoom, and animation duration not captured from formal spec; currently using ECharts defaults. */
</style>
<section class="ui-chart ui-chart-line" id="uiChartLine" data-status="data" aria-labelledby="uiChartLineTitle">
  <h2 class="ui-visually-hidden" id="uiChartLineTitle">Six-month trend</h2>
  <div class="ui-chart-data">
    <div class="ui-chart-canvas" role="img" aria-label="Monthly trend comparison: current vs previous period"></div>
  </div>
  <div class="ui-chart-empty" hidden>No trend data</div>
  <div class="ui-chart-summary" aria-live="polite">Currently showing: current period, previous period</div>
</section>
