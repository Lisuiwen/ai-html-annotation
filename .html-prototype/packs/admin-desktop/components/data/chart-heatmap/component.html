<style>
  :root { --ui-chart-height: 280px; --ui-chart-gap: 12px; --ui-chart-caption: 12px; }
  .ui-chart { display: grid; gap: var(--ui-chart-gap, 12px); min-width: 0; }
  .ui-chart-canvas { width: 100%; height: var(--ui-chart-height); min-height: 160px; }
  .ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-chart-caption, 12px); }
  .ui-chart[data-status="empty"] .ui-chart-data { display: none; }
  .ui-chart[data-status="data"] .ui-chart-empty { display: none; }
</style>
<section class="ui-chart ui-chart-heatmap" id="uiChartHeatmap" data-status="data" aria-labelledby="uiChartHeatmapTitle" data-pack-atom="chart">
  <h2 class="ui-visually-hidden" id="uiChartHeatmapTitle">Activity heatmap</h2>
  <div class="ui-chart-data">
    <div class="ui-chart-canvas" data-chart-canvas role="img" aria-label="Activity distribution by hour and day of week"></div>
  </div>
  <div class="ui-chart-empty" hidden>No heatmap data</div>
  <div class="ui-chart-summary" aria-live="polite">7×24 Activity distribution</div>
</section>
