<style>
  :root { --ui-chart-height: 240px; }
  .ui-chart { display: grid; gap: var(--ui-space-3); min-width: 0; }
  .ui-chart-canvas { width: 100%; height: var(--ui-chart-height); min-height: 160px; }
  .ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-font-size-caption); }
  .ui-chart[data-status="empty"] .ui-chart-data { display: none; }
  .ui-chart[data-status="data"] .ui-chart-empty, .ui-chart[data-status="loading"] .ui-chart-empty { display: none; }
  /* ponytail: stacked and horizontal rank bar geometry not pixel-aligned with common chart visuals. */
</style>
<section class="ui-chart ui-chart-bar" id="uiChartBar" data-status="data" aria-labelledby="uiChartBarTitle">
  <h2 class="ui-visually-hidden" id="uiChartBarTitle">Quarterly plan vs completion</h2>
  <div class="ui-chart-data">
    <div class="ui-chart-canvas" role="img" aria-label="Planned vs completed values across four quarters"></div>
  </div>
  <div class="ui-chart-empty" hidden>No comparison data</div>
  <div class="ui-chart-summary" aria-live="polite">Grouped comparison: planned, completed</div>
</section>
