<style>
  .ui-tree { display: grid; gap: var(--ui-space-1); margin: 0; padding: 0; list-style: none; }
  .ui-tree-node { color: var(--ui-text-secondary); }
  .ui-tree-row { display: flex; align-items: center; min-height: 24px; gap: var(--ui-space-1); }
  .ui-tree-toggle {
    width: 24px;
    height: 24px;
    padding: 0;
    color: inherit;
    border: 0;
    background: transparent;
  }
  .ui-tree-children { display: grid; gap: var(--ui-space-1); padding-left: var(--ui-space-6); }
</style>

<!-- ponytail: currently a plain hierarchical list with expand buttons; upgrade to ARIA Tree after capturing full keyboard behavior. -->
<ul class="ui-tree" id="uiTree">
  <li class="ui-tree-node" id="uiTreeRoot">
    <div class="ui-tree-row">
      <button class="ui-tree-toggle" type="button" aria-label="Collapse group" aria-expanded="true" aria-controls="uiTreeRootChildren">⌄</button>
      <span>Group</span>
    </div>
    <ul class="ui-tree-children" id="uiTreeRootChildren"><li>Child item</li></ul>
  </li>
</ul>
