<style>
  :root { --mv-chart-height: 240px; --mv-chart-gap: 12px; --mv-chart-caption: 12px; }
  .mv-chart { display: grid; gap: var(--mv-chart-gap, 12px); min-width: 0; }
  .mv-chart-canvas { width: 100%; height: var(--mv-chart-height); min-height: 160px; }
  .mv-chart-summary, .mv-chart-empty { color: var(--mv-text-secondary); font-size: var(--mv-chart-caption, 12px); }
  .mv-chart[data-status="empty"] .mv-chart-data { display: none; }
  .mv-chart[data-status="data"] .mv-chart-empty, .mv-chart[data-status="loading"] .mv-chart-empty { display: none; }
  /* ponytail: stacked and horizontal rank bar geometry not pixel-aligned with common chart visuals. */
</style>
<section class="mv-chart mv-chart-bar" id="uiChartBar" data-status="data" aria-labelledby="uiChartBarTitle" data-pack-atom="chart">
  <h2 class="mv-visually-hidden" id="uiChartBarTitle">Quarterly plan vs completion</h2>
  <div class="mv-chart-data">
    <div class="mv-chart-canvas" data-chart-canvas role="img" aria-label="Planned vs completed values across four quarters"></div>
  </div>
  <div class="mv-chart-empty" hidden>No comparison data</div>
  <div class="mv-chart-summary" aria-live="polite">Grouped comparison: planned, completed</div>
</section>
