<style>
  :root { --mv-chart-height: 240px; --mv-chart-gap: 12px; --mv-chart-caption: 12px; }
  .mv-chart { display: grid; gap: var(--mv-chart-gap, 12px); min-width: 0; }
  .mv-chart-canvas { width: 100%; height: var(--mv-chart-height); min-height: 160px; }
  .mv-chart-summary, .mv-chart-empty { color: var(--mv-text-secondary); font-size: var(--mv-chart-caption, 12px); }
  .mv-chart[data-status="empty"] .mv-chart-data { display: none; }
  .mv-chart[data-status="data"] .mv-chart-empty { display: none; }
  /* ponytail: pointer animation duration and segment threshold styles not captured from formal spec. */
</style>
<section class="mv-chart mv-chart-gauge" id="uiChartGauge" data-status="data" aria-labelledby="uiChartGaugeTitle" data-pack-atom="chart">
  <h2 class="mv-visually-hidden" id="uiChartGaugeTitle">Completion rate</h2>
  <div class="mv-chart-data">
    <div class="mv-chart-canvas" data-chart-canvas role="img" aria-label="Current completion rate gauge"></div>
  </div>
  <div class="mv-chart-empty" hidden>No metric data</div>
  <div class="mv-chart-summary" aria-live="polite">Current completion rate 72%</div>
</section>
