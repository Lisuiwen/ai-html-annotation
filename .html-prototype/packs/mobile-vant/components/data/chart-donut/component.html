<style>
  :root { --mv-chart-height: 240px; --mv-chart-gap: 12px; --mv-chart-caption: 12px; }
  .mv-chart { display: grid; gap: var(--mv-chart-gap, 12px); min-width: 0; }
  .mv-chart-canvas { width: 100%; height: var(--mv-chart-height); min-height: 160px; }
  .mv-chart-summary, .mv-chart-empty { color: var(--mv-text-secondary); font-size: var(--mv-chart-caption, 12px); }
  .mv-chart[data-status="empty"] .mv-chart-data { display: none; }
  .mv-chart[data-status="data"] .mv-chart-empty, .mv-chart[data-status="loading"] .mv-chart-empty { display: none; }
  /* ponytail: sector selection interaction currently approximated by ECharts emphasis; center label linkage not implemented separately. */
</style>
<section class="mv-chart mv-chart-donut" id="uiChartDonut" data-status="data" aria-labelledby="uiChartDonutTitle" data-pack-atom="chart">
  <h2 class="mv-visually-hidden" id="uiChartDonutTitle">Source composition</h2>
  <div class="mv-chart-data">
    <div class="mv-chart-canvas" data-chart-canvas role="img" aria-label="Share of three sources: online, offline, referral"></div>
  </div>
  <div class="mv-chart-empty" hidden>No composition data</div>
  <div class="mv-chart-summary" aria-live="polite">Composition: online, offline, referral</div>
</section>
