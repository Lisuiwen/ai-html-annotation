<style>
  :root { --{{prefix}}chart-height: 240px; --{{prefix}}chart-gap: 12px; --{{prefix}}chart-caption: 12px; }
  .{{prefix}}chart { display: grid; gap: var(--{{prefix}}chart-gap, 12px); min-width: 0; }
  .{{prefix}}chart-canvas { width: 100%; height: var(--{{prefix}}chart-height); min-height: 160px; }
  .{{prefix}}chart-summary, .{{prefix}}chart-empty { color: var(--{{prefix}}text-secondary); font-size: var(--{{prefix}}chart-caption, 12px); }
  .{{prefix}}chart[data-status="empty"] .{{prefix}}chart-data { display: none; }
  .{{prefix}}chart[data-status="data"] .{{prefix}}chart-empty, .{{prefix}}chart[data-status="loading"] .{{prefix}}chart-empty { display: none; }
  /* ponytail: stacked and horizontal rank bar geometry not pixel-aligned with common chart visuals. */
</style>
<section class="{{prefix}}chart {{prefix}}chart-bar" id="uiChartBar" data-status="data" aria-labelledby="uiChartBarTitle" data-pack-atom="chart">
  <h2 class="{{prefix}}visually-hidden" id="uiChartBarTitle">Quarterly plan vs completion</h2>
  <div class="{{prefix}}chart-data">
    <div class="{{prefix}}chart-canvas" data-chart-canvas role="img" aria-label="Planned vs completed values across four quarters"></div>
  </div>
  <div class="{{prefix}}chart-empty" hidden>No comparison data</div>
  <div class="{{prefix}}chart-summary" aria-live="polite">Grouped comparison: planned, completed</div>
</section>
