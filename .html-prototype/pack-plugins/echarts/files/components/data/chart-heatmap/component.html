<style>
  :root { --{{prefix}}chart-height: 280px; --{{prefix}}chart-gap: 12px; --{{prefix}}chart-caption: 12px; }
  .{{prefix}}chart { display: grid; gap: var(--{{prefix}}chart-gap, 12px); min-width: 0; }
  .{{prefix}}chart-canvas { width: 100%; height: var(--{{prefix}}chart-height); min-height: 160px; }
  .{{prefix}}chart-summary, .{{prefix}}chart-empty { color: var(--{{prefix}}text-secondary); font-size: var(--{{prefix}}chart-caption, 12px); }
  .{{prefix}}chart[data-status="empty"] .{{prefix}}chart-data { display: none; }
  .{{prefix}}chart[data-status="data"] .{{prefix}}chart-empty { display: none; }
</style>
<section class="{{prefix}}chart {{prefix}}chart-heatmap" id="uiChartHeatmap" data-status="data" aria-labelledby="uiChartHeatmapTitle" data-pack-atom="chart">
  <h2 class="{{prefix}}visually-hidden" id="uiChartHeatmapTitle">Activity heatmap</h2>
  <div class="{{prefix}}chart-data">
    <div class="{{prefix}}chart-canvas" data-chart-canvas role="img" aria-label="Activity distribution by hour and day of week"></div>
  </div>
  <div class="{{prefix}}chart-empty" hidden>No heatmap data</div>
  <div class="{{prefix}}chart-summary" aria-live="polite">7×24 Activity distribution</div>
</section>
