<style>
  :root { --{{prefix}}chart-height: 240px; --{{prefix}}chart-gap: 12px; --{{prefix}}chart-caption: 12px; }
  .{{prefix}}chart { display: grid; gap: var(--{{prefix}}chart-gap, 12px); min-width: 0; }
  .{{prefix}}chart-canvas { width: 100%; height: var(--{{prefix}}chart-height); min-height: 160px; }
  .{{prefix}}chart-summary, .{{prefix}}chart-empty { color: var(--{{prefix}}text-secondary); font-size: var(--{{prefix}}chart-caption, 12px); }
  .{{prefix}}chart[data-status="empty"] .{{prefix}}chart-data { display: none; }
  .{{prefix}}chart[data-status="data"] .{{prefix}}chart-empty, .{{prefix}}chart[data-status="loading"] .{{prefix}}chart-empty { display: none; }
  /* ponytail: sector selection interaction currently approximated by ECharts emphasis; center label linkage not implemented separately. */
</style>
<section class="{{prefix}}chart {{prefix}}chart-donut" id="uiChartDonut" data-status="data" aria-labelledby="uiChartDonutTitle" data-pack-atom="chart">
  <h2 class="{{prefix}}visually-hidden" id="uiChartDonutTitle">Source composition</h2>
  <div class="{{prefix}}chart-data">
    <div class="{{prefix}}chart-canvas" data-chart-canvas role="img" aria-label="Share of three sources: online, offline, referral"></div>
  </div>
  <div class="{{prefix}}chart-empty" hidden>No composition data</div>
  <div class="{{prefix}}chart-summary" aria-live="polite">Composition: online, offline, referral</div>
</section>
