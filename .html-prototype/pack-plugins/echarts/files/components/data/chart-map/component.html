<style>
  :root { --{{prefix}}chart-height: 360px; --{{prefix}}chart-gap: 12px; --{{prefix}}chart-caption: 12px; }
  .{{prefix}}chart { display: grid; gap: var(--{{prefix}}chart-gap, 12px); min-width: 0; }
  .{{prefix}}chart-canvas { width: 100%; height: var(--{{prefix}}chart-height); min-height: 200px; }
  .{{prefix}}chart-summary, .{{prefix}}chart-empty { color: var(--{{prefix}}text-secondary); font-size: var(--{{prefix}}chart-caption, 12px); }
  .{{prefix}}chart[data-status="empty"] .{{prefix}}chart-data { display: none; }
  .{{prefix}}chart[data-status="data"] .{{prefix}}chart-empty, .{{prefix}}chart[data-status="loading"] .{{prefix}}chart-empty { display: none; }
  /* ponytail: province-level China mock only; city-level geo and boundary hover not implemented. */
</style>
<section class="{{prefix}}chart {{prefix}}chart-map" id="uiChartMap" data-status="data" aria-labelledby="uiChartMapTitle" data-pack-atom="chart">
  <h2 class="{{prefix}}visually-hidden" id="uiChartMapTitle">Regional task volume</h2>
  <div class="{{prefix}}chart-data">
    <div class="{{prefix}}chart-canvas" data-chart-canvas role="img" aria-label="Task volume by province"></div>
  </div>
  <div class="{{prefix}}chart-empty" hidden>No map data</div>
  <div class="{{prefix}}chart-summary" aria-live="polite">Province-level regional stats</div>
</section>
