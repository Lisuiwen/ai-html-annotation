<!--
  Formal UI annotations pack: every prototype loads this as a declarative example for the Notes Viewer and unified state coordinator.
  State coordination comes from runtime/client/core/state.js; scenario metadata and when matching from runtime/client/notes/model.js;
  the right-rail DOM, styles, and connector logic are created by runtime/client/notes/viewer.js — prototype HTML must not hard-code these runtime responsibilities.
  Cards show title and body only; target.label stays structured data and is not repeated inside the card.
  Author-mode actions are injected dynamically by the html-prototype-build local server (runtime/server/index.mjs).
-->

<!-- Prefer semantic ids as stable anchors; do not store state in DOM attributes. -->
<button
  id="primaryAction"
  class="ui-button ui-button--primary"
  data-ui-interactive>
  Primary action
</button>
<section id="contentArea" class="ui-component-box">Content area</section>

<!--
  prototype/notes.snapshot.js is the sole annotation data source.
  At generation time, write a separate UTF-8 file; do not inline this script block into prototype.html and do not generate notes.json.
-->
<script>
/*
 * One structured annotation payload for the read-only Viewer, Notes Editor, and AI.
 * Keep strict JSON on the assignment side; top-level state is the baseline, scenarios store restorable diffs only.
 */
window.__PROTOTYPE_NOTES__ = {
  "schemaVersion": 2,
  "state": {
    "product": { "page": "list", "layers": [] }
  },
  "activeScenario": "base",
  "header": {
    "title": "Feature notes",
    "subtitle": "Show matching notes by unified business state"
  },
  "scenarios": {
    "base": { "state": {} },
    "create": {
      "extends": "base",
      "state": { "product": { "layers": ["create"] } }
    }
  },
  "cards": [
    {
      "id": "primary-action",
      "when": { "product.page": "list", "product.layers": [] },
      "title": "Primary action",
      "body": "Describe the business purpose of this action.",
      "target": {
        "anchor": "primaryAction",
        "label": "Primary action"
      }
    },
    {
      "id": "content-area",
      "title": "Content area",
      "body": "Describe the data and state of this area.",
      "target": {
        "anchor": "contentArea",
        "label": "Content area"
      }
    }
  ]
};
</script>

<!-- Load at the end of prototype.html in fixed Client Runtime order. -->
<script src="./prototype/notes.snapshot.js"></script>
<script src="./prototype/display-mode.js"></script>
<script src="./prototype/state.js"></script>
<script src="./prototype/model.js"></script>
<script src="./prototype/viewer.js" data-prototype-notes-viewer></script>
