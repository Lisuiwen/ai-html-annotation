<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module sketch</title>
  <link rel="stylesheet" href="/sketch/board.css">
</head>
<body class="app">
  <main class="stage">
    <div class="board-fit">
      <div id="board" class="board" data-tool="select"></div>
    </div>
  </main>
  <aside class="dock">
    <h1>Module sketch</h1>
    <p class="hint">Ctrl+Z undo, Delete remove, ] bring forward, [ send back. Double-click text to edit, Esc to leave it. The screenshot is the canvas only.</p>
    <label class="pack-picker">Pack<select id="pack-select" aria-label="Pack"></select></label>
    <div class="dock-actions">
      <label class="file-button" title="Lay an existing page screenshot under the canvas to place modules against it. The export includes it.">Underlay<input id="underlay-file" type="file" accept="image/*"></label>
      <button type="button" id="export" class="primary">Screenshot</button>
      <button type="button" id="clear-board" class="danger">Clear</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <div id="palette" class="palette"></div>
  </aside>
  <div id="measurer" class="measurer" aria-hidden="true"></div>
  <script type="module" src="/sketch/board.js"></script>
</body>
</html>
