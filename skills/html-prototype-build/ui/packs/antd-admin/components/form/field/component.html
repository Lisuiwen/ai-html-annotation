<style>
  .ui-field {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: center;
    min-height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    gap: var(--ui-space-2);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
  }
  .ui-field-label { color: var(--ui-text-secondary); white-space: nowrap; }
  .ui-field > .ui-input,
  .ui-field .ui-select-trigger {
    width: 100%;
    min-width: 0;
    height: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  .ui-field > .ui-select { width: 100%; min-width: 0; }
  .ui-field .ui-input:focus-visible,
  .ui-field .ui-select-trigger:focus-visible { outline: none; }
  /* ponytail: focus 视觉未采集；取得真实焦点态后替换当前近似。 */
  .ui-field:focus-within { outline: 2px solid var(--ui-primary); outline-offset: 1px; }
  .ui-required { color: var(--ui-primary); }
  /* ponytail: 错误颜色、图标和触发时机未采集；取得真实校验状态后替换。 */
  .ui-field--error { border-color: var(--ui-primary); box-shadow: 0 0 0 1px var(--ui-primary); }
  .ui-field-error {
    grid-column: 1 / -1;
    color: var(--ui-primary);
    font-size: var(--ui-font-size-caption);
  }
</style>

<div class="ui-field">
  <span class="ui-field-label">字段名称 <span class="ui-required" aria-hidden="true">*</span></span>
  <!-- slot: form.input or form.select；插入后建立可访问标签关联。 -->
</div>
