<style>
  :root { --ui-chart-height: 240px; }
  .ui-chart { display: grid; gap: var(--ui-space-3); min-width: 0; }
  .ui-chart-canvas { width: 100%; height: var(--ui-chart-height); min-height: 160px; }
  .ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-font-size-caption); }
  .ui-chart[data-status="empty"] .ui-chart-data { display: none; }
  .ui-chart[data-status="data"] .ui-chart-empty { display: none; }
</style>
<section class="ui-chart ui-chart-mixed" id="uiChartMixed" data-status="data" aria-labelledby="uiChartMixedTitle">
  <h2 class="ui-visually-hidden" id="uiChartMixedTitle">任务量与完成率</h2>
  <div class="ui-chart-data">
    <div class="ui-chart-canvas" role="img" aria-label="柱线混合对比"></div>
  </div>
  <div class="ui-chart-empty" hidden>暂无混合图数据</div>
  <div class="ui-chart-summary" aria-live="polite">柱线混合：任务量 + 完成率</div>
</section>
