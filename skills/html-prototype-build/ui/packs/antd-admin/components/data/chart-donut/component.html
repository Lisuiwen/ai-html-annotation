<style>
  :root { --ui-chart-height: 240px; }
  .ui-chart { display: grid; gap: var(--ui-space-3); min-width: 0; }.ui-chart-layout { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(120px, auto); align-items: center; gap: var(--ui-space-4); }.ui-chart-graphic { display: block; width: 100%; height: var(--ui-chart-height); }.ui-chart-legend { display: grid; gap: var(--ui-space-2); }.ui-chart-legend-button { display: inline-flex; align-items: center; gap: var(--ui-space-1); padding: 0; color: var(--ui-text-secondary); border: 0; background: transparent; text-align: left; }.ui-chart-legend-button::before { width: var(--ui-space-2); height: var(--ui-space-2); border-radius: 50%; background: var(--ui-chart-color); content: ""; }.ui-chart-legend-button[aria-pressed="false"] { color: var(--ui-text-disabled); text-decoration: line-through; }.ui-chart-legend-button:focus-visible, .ui-chart-donut-slice:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }.ui-chart-donut-slice { cursor: pointer; stroke: var(--ui-bg); stroke-width: 2; }.ui-chart-donut-slice.is-selected { stroke-width: 4; }.ui-chart-donut-primary { fill: var(--ui-primary); }.ui-chart-donut-success { fill: var(--ui-success); }.ui-chart-donut-warning { fill: var(--ui-warning); }.ui-chart-center-label { fill: var(--ui-text-secondary); font: var(--ui-font-size-caption) var(--ui-font); }.ui-chart-center-value { fill: var(--ui-text); font: var(--ui-font-weight-semibold) 24px var(--ui-font); }.ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-font-size-caption); }.ui-chart[data-status="empty"] .ui-chart-data { display: none; }.ui-chart[data-status="data"] .ui-chart-empty { display: none; }
  /* ponytail: 当前扇区形状和占比为 SVG 示例数据；获得真实构成数据、label 避让或 tooltip 需求后，以图表渲染层替换。 */
</style>
<section class="ui-chart ui-chart-donut" id="uiChartDonut" data-status="data" aria-labelledby="uiChartDonutTitle">
  <div class="ui-chart-layout ui-chart-data"><svg class="ui-chart-graphic" viewBox="0 0 240 240" role="img" aria-labelledby="uiChartDonutTitle uiChartDonutDescription"><title id="uiChartDonutTitle">来源构成</title><desc id="uiChartDonutDescription">线上、线下和转介绍三个来源的构成占比。</desc><path class="ui-chart-donut-slice ui-chart-donut-primary is-selected" data-series-key="primary" data-label="线上" data-value="62%" d="M120 24 A96 96 0 1 1 30 154 L63 142 A61 61 0 1 0 120 59Z" role="button" tabindex="0" aria-pressed="true"><title>线上 62%</title></path><path class="ui-chart-donut-slice ui-chart-donut-success" data-series-key="success" data-label="线下" data-value="23%" d="M30 154 A96 96 0 0 1 45 68 L72 86 A61 61 0 0 0 63 142Z" role="button" tabindex="0" aria-pressed="false"><title>线下 23%</title></path><path class="ui-chart-donut-slice ui-chart-donut-warning" data-series-key="warning" data-label="转介绍" data-value="15%" d="M45 68 A96 96 0 0 1 120 24 L120 59 A61 61 0 0 0 72 86Z" role="button" tabindex="0" aria-pressed="false"><title>转介绍 15%</title></path><text class="ui-chart-center-label" x="120" y="108" text-anchor="middle">当前来源</text><text class="ui-chart-center-value" x="120" y="136" text-anchor="middle">线上</text></svg><div class="ui-chart-legend" aria-label="构成分类"><button class="ui-chart-legend-button" type="button" data-series-key="primary" aria-pressed="true" style="--ui-chart-color:var(--ui-primary)">线上 62%</button><button class="ui-chart-legend-button" type="button" data-series-key="success" aria-pressed="true" style="--ui-chart-color:var(--ui-success)">线下 23%</button><button class="ui-chart-legend-button" type="button" data-series-key="warning" aria-pressed="true" style="--ui-chart-color:var(--ui-warning)">转介绍 15%</button></div></div><div class="ui-chart-empty" hidden>暂无构成数据</div><div class="ui-chart-summary" aria-live="polite">已选中：线上 62%</div>
</section>
