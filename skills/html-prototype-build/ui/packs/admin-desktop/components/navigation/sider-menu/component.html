<style>
  /* Sider width is declared by the component; Application Shell and App Header reuse it. */
  :root { --ui-sider-width: 224px; }
  .ui-sider {
    padding: var(--ui-space-4) var(--ui-space-2);
    border-right: 1px solid var(--ui-border-subtle);
    background: var(--ui-bg);
  }
  .ui-menu { display: grid; gap: var(--ui-space-1); }
  .ui-menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    height: 40px;
    padding: 0 var(--ui-space-3);
    gap: var(--ui-space-3);
    color: var(--ui-text-secondary);
    text-align: left;
    border: 0;
    border-radius: var(--ui-radius-control);
    background: transparent;
  }
  /* ponytail: menu hover and active not captured; replace current approximation with real state when available. */
  .ui-menu-item:hover, .ui-menu-item.is-active { color: var(--ui-primary); background: var(--ui-bg-soft); }
</style>

<aside class="ui-sider" id="uiSider">
  <nav class="ui-menu" id="uiSiderMenu" aria-label="Sidebar menu">
    <button class="ui-menu-item is-active" type="button" aria-current="page">
      <span aria-hidden="true">◇</span><span>Current menu</span>
    </button>
    <button class="ui-menu-item" type="button">
      <span aria-hidden="true">□</span><span>Other menu</span>
    </button>
  </nav>
</aside>
