<style>
  .ui-steps { display: flex; gap: var(--ui-space-3); }.ui-step { display: grid; grid-template-columns: 24px auto; align-items: start; flex: 1; gap: var(--ui-space-2); color: var(--ui-text-secondary); }.ui-step-index { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid var(--ui-border); border-radius: 50%; }.ui-step[data-status="process"] { color: var(--ui-primary); }.ui-step[data-status="process"] .ui-step-index { border-color: var(--ui-primary); background: var(--ui-primary); color: var(--ui-text-on-primary); }.ui-step[data-status="finish"] { color: var(--ui-success); }.ui-step[data-status="finish"] .ui-step-index { border-color: var(--ui-success); }.ui-step[data-status="error"] { color: var(--ui-error); }.ui-step[data-status="error"] .ui-step-index { border-color: var(--ui-error); }.ui-step-title { color: var(--ui-text); font-weight: var(--ui-font-weight-semibold); }.ui-step-description { margin-top: var(--ui-space-1); font-size: var(--ui-font-size-caption); }
</style>
