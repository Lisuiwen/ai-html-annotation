<style>
  /* ponytail: Modal visuals not captured; replace visuals and focus management with real states when available. */
  .ui-modal-overlay { align-items: center; justify-content: center; padding: var(--ui-space-6); }
  .ui-modal {
    width: min(520px, 100%);
    overflow: hidden;
    border-radius: var(--ui-radius-container);
    background: var(--ui-bg);
  }
</style>

<!-- Place this structure in the left product area .ui-preview. -->
<button class="ui-button ui-button--primary" id="uiDemoModalOpen" type="button" aria-controls="uiDemoModal" aria-haspopup="dialog">Open Modal</button>
<div class="ui-overlay ui-modal-overlay" id="uiDemoModal" role="dialog" aria-modal="true" aria-labelledby="uiModalTitle" aria-hidden="true" hidden>
  <!-- Annotation wiring binds to inner panel id ({overlayId}Panel); overlay id is for Adapter / ARIA only. -->
  <div class="ui-modal" id="uiDemoModalPanel">
    <div class="ui-layer-head">
      <strong id="uiModalTitle">Modal title</strong>
      <button class="ui-button ui-button--icon" id="uiDemoModalClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="ui-layer-body">General content area</div>
    <div class="ui-layer-foot">
      <button class="ui-button" id="uiDemoModalCancel" type="button">Cancel</button>
      <button class="ui-button ui-button--primary" id="uiDemoModalConfirm" type="button">Confirm</button>
    </div>
  </div>
</div>
