<style>
  /* button-specific sizing and shadows are not part of global Foundation. */
  :root {
    --ui-button-padding-inline: 15px;
    --ui-button-icon-size: 32px;
    --ui-button-shadow: 0 2px 0 rgba(0, 0, 0, 0.02);
    --ui-button-primary-shadow: 0 2px 0 rgba(5, 145, 255, 0.1);
  }
  .ui-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: var(--ui-button-icon-size);
    height: var(--ui-control-height);
    padding: 0 var(--ui-button-padding-inline);
    gap: var(--ui-space-2);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
    box-shadow: var(--ui-button-shadow);
  }
  /* ponytail: hover and focus visuals not captured; replace current approximations with real computed styles when available. */
  .ui-button:hover:not(:disabled):not(.ui-button--primary):not(.ui-button--text):not(.ui-button--danger-text) {
    color: var(--ui-primary);
    border-color: var(--ui-primary);
  }
  .ui-button:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 1px; }
  .ui-button--primary {
    color: var(--ui-text-on-primary);
    border-color: var(--ui-primary);
    background: var(--ui-primary);
    box-shadow: var(--ui-button-primary-shadow);
  }
  .ui-button--primary:hover:not(:disabled) {
    color: var(--ui-text-on-primary);
    background: #4096ff;
    border-color: #4096ff;
  }
  .ui-button--text {
    padding-inline: var(--ui-space-2);
    color: var(--ui-text-secondary);
    border-color: transparent;
    background: transparent;
    box-shadow: none;
  }
  .ui-button--icon {
    width: var(--ui-button-icon-size);
    padding: 0;
    font-size: 16px;
  }
  .ui-button:disabled {
    color: var(--ui-text-disabled);
    border-color: var(--ui-border-soft);
    background: var(--ui-bg-soft);
    box-shadow: none;
  }
  .ui-button-row { display: flex; flex-wrap: wrap; gap: var(--ui-space-2); }
</style>

<!-- Keep only the button variants actually used. -->
<div class="ui-button-row">
  <button class="ui-button" type="button">Secondary action</button>
  <button class="ui-button ui-button--primary" type="button">Primary action</button>
  <button class="ui-button ui-button--text" type="button">Text action</button>
  <button class="ui-button ui-button--icon" type="button" aria-label="Icon action">◇</button>
</div>
