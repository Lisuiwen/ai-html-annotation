<style>
  :root { --ui-chart-height: 240px; }
  .ui-chart { display: grid; gap: var(--ui-space-3); min-width: 0; }
  .ui-chart-canvas { width: 100%; height: var(--ui-chart-height); min-height: 160px; }
  .ui-chart-summary, .ui-chart-empty { color: var(--ui-text-secondary); font-size: var(--ui-font-size-caption); }
  .ui-chart[data-status="empty"] .ui-chart-data { display: none; }
  .ui-chart[data-status="data"] .ui-chart-empty, .ui-chart[data-status="loading"] .ui-chart-empty { display: none; }
  /* ponytail: sector selection interaction currently approximated by ECharts emphasis; center label linkage not implemented separately. */
</style>
<section class="ui-chart ui-chart-donut" id="uiChartDonut" data-status="data" aria-labelledby="uiChartDonutTitle">
  <h2 class="ui-visually-hidden" id="uiChartDonutTitle">Source composition</h2>
  <div class="ui-chart-data">
    <div class="ui-chart-canvas" role="img" aria-label="Share of three sources: online, offline, referral"></div>
  </div>
  <div class="ui-chart-empty" hidden>No composition data</div>
  <div class="ui-chart-summary" aria-live="polite">Composition: online, offline, referral</div>
</section>
