<style>
  :root { --ui-select-width: 214px; }
  .ui-select-field { display: grid; gap: var(--ui-space-2); }
  .ui-select { position: relative; width: var(--ui-select-width); }
  .ui-select-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
    cursor: pointer;
  }
  /* ponytail: focus visuals not captured; replace current approximation with real focus state when available. */
  .ui-select-trigger:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 1px; }
  /* ponytail: dropdown layer and option states not captured; replace current approximation with real expanded state when available. */
  .ui-select-menu {
    position: absolute;
    top: calc(100% + var(--ui-space-1));
    left: 0;
    z-index: 45;
    display: none;
    width: 100%;
    padding: var(--ui-space-1);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
    box-shadow: 0 8px 24px var(--ui-border-subtle);
  }
  .ui-select.is-open .ui-select-menu { display: block; }
  .ui-select-option {
    width: 100%;
    padding: 5px var(--ui-space-2);
    color: var(--ui-text);
    text-align: left;
    border: 0;
    border-radius: var(--ui-space-1);
    background: transparent;
  }
  .ui-select-option:hover, .ui-select-option[aria-selected="true"] {
    color: var(--ui-primary);
    background: var(--ui-bg-soft);
  }
</style>

<label class="ui-select-field">
  <span>Field label</span>
  <div class="ui-select" id="uiSelect">
    <button class="ui-select-trigger" type="button" aria-haspopup="listbox" aria-controls="uiSelectOptions" aria-expanded="false">
      <span class="ui-select-value">Please select</span><span aria-hidden="true">⌄</span>
    </button>
    <div class="ui-select-menu" id="uiSelectOptions" role="listbox">
      <button class="ui-select-option" type="button" role="option" aria-selected="false">Option 1</button>
    </div>
  </div>
</label>
