<style>
  :root { --ui-date-picker-width: 160px; }
  .ui-date-picker { position: relative; width: var(--ui-date-picker-width); }
  .ui-date-picker-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
  }
  .ui-date-picker.has-error .ui-date-picker-trigger { border-color: var(--ui-error); }
  .ui-date-picker-value {
    overflow: hidden;
    color: var(--ui-text-secondary);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* ponytail: date panel and keyboard selection not captured; add after capturing real calendar interaction evidence. */
  .ui-date-picker-panel {
    display: none;
    position: absolute;
    z-index: 45;
    top: calc(100% + var(--ui-space-1));
    width: 100%;
    padding: var(--ui-space-3);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-container);
    background: var(--ui-bg);
  }
  .ui-date-picker.is-open .ui-date-picker-panel { display: block; }
</style>

<div class="ui-date-picker" id="uiDatePicker">
  <button class="ui-date-picker-trigger" type="button" aria-haspopup="dialog" aria-controls="uiDatePickerPanel" aria-expanded="false">
    <span class="ui-date-picker-value">Please select date</span>
    <span aria-hidden="true">▣</span>
  </button>
  <div class="ui-date-picker-panel" id="uiDatePickerPanel" role="dialog" aria-label="Select date">Date panel provided by the final prototype.</div>
</div>
