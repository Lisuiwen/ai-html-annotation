<!-- form.radio-group: stacked radio rows -->
<style>
  .mv-radio-group { background: var(--mv-white); }
  .mv-radio-group__item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: 0 16px;
    border-bottom: 1px solid var(--mv-border-color);
  }
  .mv-radio-group__item:last-child { border-bottom: none; }
  .mv-radio-group__label { font-size: var(--mv-font-size); color: var(--mv-text-color); }
  .mv-radio-group__icon {
    width: 18px;
    height: 18px;
    border: 1px solid var(--mv-text-3);
    border-radius: 50%;
  }
  .mv-radio-group__item--checked .mv-radio-group__icon {
    border-color: var(--mv-primary);
    background: radial-gradient(circle at center, var(--mv-primary) 0 5px, transparent 5px);
  }
</style>
<div class="mv-radio-group" data-mv-key="radio-group" role="radiogroup">
  <div class="mv-radio-group__item" data-mv-key="option-a" role="radio" aria-checked="false">
    <span class="mv-radio-group__label">选项一</span>
    <span class="mv-radio-group__icon" aria-hidden="true"></span>
  </div>
  <div class="mv-radio-group__item" data-mv-key="option-b" role="radio" aria-checked="false">
    <span class="mv-radio-group__label">选项二</span>
    <span class="mv-radio-group__icon" aria-hidden="true"></span>
  </div>
</div>
