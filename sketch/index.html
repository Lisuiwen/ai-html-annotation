<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块草图</title>
  <link rel="stylesheet" href="/.html-prototype/packs/admin-desktop/foundation/tokens.css">
  <link rel="stylesheet" href="/.html-prototype/packs/admin-desktop/foundation/base.css">
  <link rel="stylesheet" href="/sketch/board.css">
</head>
<body class="app">
  <main class="stage">
    <div class="board-fit">
      <div id="board" class="board" data-tool="select"></div>
    </div>
  </main>
  <aside class="dock">
    <h1>模块草图</h1>
    <p class="hint">Ctrl+Z 撤回，Delete 删除，] 置顶，[ 置底。文字点两下编辑，Esc 退出编辑。截图只含画布。</p>
    <div class="dock-actions">
      <label class="file-button" title="把一张现有页面截图铺在画布底下，用来对照摆新模块。导出的图会带上它。">导入底图<input id="underlay-file" type="file" accept="image/*"></label>
      <button type="button" id="export" class="primary">截图</button>
      <button type="button" id="clear-board" class="danger">清空</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <div id="palette" class="palette"></div>
  </aside>
  <div id="measurer" class="measurer" aria-hidden="true"></div>
  <script type="module" src="/sketch/board.js"></script>
</body>
</html>
