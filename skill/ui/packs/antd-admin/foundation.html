<!--
  UI 核心包：所有原型必读。
  复制 :root、基础重置、页面壳层和通用按钮；其他组件按需读取对应类别包。
-->
<style>
  /* 已确认 UI Token：值来自同包 design-system.md。 */
  :root {
    --ui-primary: #1677ff;
    --ui-bg-page: #f3f4f7;
    --ui-bg: #ffffff;
    --ui-bg-soft: #fafafa;
    --ui-text: rgba(0, 0, 0, 0.88);
    --ui-text-secondary: rgba(0, 0, 0, 0.65);
    --ui-text-tertiary: rgba(0, 0, 0, 0.45);
    --ui-text-disabled: rgba(0, 0, 0, 0.25);
    --ui-border: #d9d9d9;
    --ui-border-soft: #f0f0f0;
    --ui-border-subtle: rgba(0, 0, 0, 0.06);
    --ui-text-on-primary: #ffffff;
    --ui-space-1: 4px;
    --ui-space-2: 8px;
    --ui-space-3: 12px;
    --ui-space-4: 16px;
    --ui-space-6: 24px;
    --ui-control-height: 32px;
    --ui-radius-control: 6px;
    --ui-radius-container: 8px;
    --ui-header-height: 64px;
    --ui-sider-width: 224px;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol", "Noto Color Emoji";
    --ui-font-size-caption: 12px;
    --ui-font-size-body: 14px;
    --ui-font-size-nav: 16px;
    --ui-font-size-page-title: 16px;
    --ui-line-height-caption: 12px;
    --ui-line-height-body: 22px;
    --ui-line-height-tree-node: 24px;
    --ui-line-height-nav: 64px;
    --ui-line-height-page-title: 18.4px;
    --ui-font-weight-regular: 400;
    --ui-font-weight-semibold: 600;
    --ui-control-width-default: 214px;
    --ui-control-padding-inline: 11px;
    --ui-button-padding-inline: 15px;
    --ui-icon-button-size: 32px;
    --ui-search-width: 269px;
    --ui-filter-height: 102px;
    --ui-toolbar-height: 44px;
    --ui-table-header-height: 39px;
    --ui-table-cell-padding: 8px;
    --ui-page-titlebar-height: 56px;
    --ui-shadow-button: 0 2px 0 rgba(0, 0, 0, 0.02);
    --ui-shadow-primary: 0 2px 0 rgba(5, 145, 255, 0.1);
  }

  /* 基础重置与通用页面容器。 */
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ui-text);
    background: var(--ui-bg-page);
    font: var(--ui-font-size-body)/var(--ui-line-height-body) var(--ui-font);
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .ui-shell { min-width: 1040px; min-height: 100vh; background: var(--ui-bg-page); }
  .ui-shell-body {
    display: grid;
    grid-template-columns: var(--ui-sider-width) minmax(0, 1fr);
    min-height: calc(100vh - var(--ui-header-height));
  }
  .ui-content { min-width: 0; padding: var(--ui-space-4); }
  .ui-content-card {
    min-height: calc(100vh - var(--ui-header-height) - 2 * var(--ui-space-4));
    overflow: hidden;
    border: 1px solid var(--ui-border-subtle);
    border-radius: var(--ui-radius-container);
    background: var(--ui-bg);
  }
  .ui-page-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: var(--ui-page-titlebar-height);
    padding: 0 var(--ui-space-4);
    border-bottom: 1px solid var(--ui-border-soft);
  }
  .ui-page-title h1 {
    margin: 0;
    font-size: var(--ui-font-size-page-title);
    line-height: var(--ui-line-height-page-title);
    font-weight: var(--ui-font-weight-semibold);
  }
  .ui-sections { display: grid; gap: var(--ui-space-6); padding: var(--ui-space-4); }
  .ui-section { display: grid; gap: var(--ui-space-3); }
  .ui-section h2 { margin: 0; font-size: 14px; }
  .ui-component-box {
    display: grid;
    gap: var(--ui-space-4);
    padding: var(--ui-space-4);
    border: 1px solid var(--ui-border-soft);
    border-radius: var(--ui-radius-container);
    background: var(--ui-bg);
  }

  /* 通用按钮；所有类别包均可复用。 */
  .ui-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: var(--ui-icon-button-size);
    height: var(--ui-control-height);
    padding: 0 var(--ui-button-padding-inline);
    gap: var(--ui-space-2);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
    box-shadow: var(--ui-shadow-button);
  }
  /* ponytail: hover 和 focus 视觉未采集；取得真实计算样式后替换当前近似。 */
  .ui-button:hover:not(:disabled) { color: var(--ui-primary); border-color: var(--ui-primary); }
  .ui-button:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 1px; }
  .ui-button--primary {
    color: var(--ui-text-on-primary);
    border-color: var(--ui-primary);
    background: var(--ui-primary);
    box-shadow: var(--ui-shadow-primary);
  }
  .ui-button--text {
    padding-inline: var(--ui-space-2);
    color: var(--ui-text-secondary);
    border-color: transparent;
    background: transparent;
    box-shadow: none;
  }
  .ui-button--icon {
    width: var(--ui-icon-button-size);
    padding: 0;
    font-size: var(--ui-font-size-nav);
  }
  .ui-button:disabled {
    color: var(--ui-text-disabled);
    border-color: var(--ui-border-soft);
    background: var(--ui-bg-soft);
    box-shadow: none;
  }
  .ui-button-row { display: flex; flex-wrap: wrap; gap: var(--ui-space-2); }
</style>

<!-- 最小壳层和按钮结构示例；复制后替换为当前需求内容。 -->
<div class="ui-shell" id="uiShell">
  <div class="ui-shell-body" id="uiShellBody">
    <aside id="uiSider"><!-- 按需加入 ui-navigation.html 的侧栏。 --></aside>
    <main class="ui-content" id="uiContent">
      <article class="ui-content-card" id="uiContentCard">
        <div class="ui-page-title" id="uiPageTitle">
          <h1>页面标题</h1>
          <button class="ui-button ui-button--primary">主操作</button>
        </div>
      </article>
    </main>
  </div>
</div>
