<!--
  UI 表单包：需要输入框、搜索框、Select、字段布局或校验示意时读取。
  依赖同包 foundation.html。
-->
<style>
  /* 输入框、字段和组合搜索。 */
  .ui-input, .ui-select-trigger {
    width: 100%;
    height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
  }
  .ui-input::placeholder { color: var(--ui-text-tertiary); }
  .ui-input:disabled { color: var(--ui-text-disabled); background: var(--ui-bg-soft); }
  /* ponytail: focus 视觉未采集；取得真实焦点态后替换当前可见焦点近似。 */
  .ui-input:focus-visible, .ui-select-trigger:focus-visible {
    outline: 2px solid var(--ui-primary);
    outline-offset: 1px;
  }
  /* 框内标签：边框在 .ui-field 上；label 深色、placeholder 浅色，二者不得合成一句。 */
  .ui-field {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: center;
    min-height: var(--ui-control-height);
    padding: 0 var(--ui-control-padding-inline);
    gap: var(--ui-space-2);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
  }
  .ui-field-label {
    color: var(--ui-text-secondary);
    white-space: nowrap;
  }
  /* 框内控件去掉自身边框，避免双框。 */
  .ui-field > .ui-input,
  .ui-field .ui-select-trigger {
    width: 100%;
    min-width: 0;
    height: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  .ui-field > .ui-select { width: 100%; min-width: 0; }
  .ui-field .ui-input:focus-visible,
  .ui-field .ui-select-trigger:focus-visible { outline: none; }
  .ui-field:focus-within {
    outline: 2px solid var(--ui-primary);
    outline-offset: 1px;
  }
  .ui-required { color: var(--ui-primary); }
  .ui-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(180px, 1fr));
    gap: var(--ui-space-4);
  }
  .ui-search { display: flex; width: var(--ui-search-width); }
  .ui-search .ui-input {
    min-width: 0;
    border-radius: var(--ui-radius-control) 0 0 var(--ui-radius-control);
  }
  .ui-search .ui-button {
    flex: 0 0 var(--ui-icon-button-size);
    padding: 0;
    border-left: 0;
    border-radius: 0 var(--ui-radius-control) var(--ui-radius-control) 0;
  }

  /* ponytail: 错误颜色、图标和触发时机未采集；取得真实校验状态后替换。 */
  .ui-field--error { border-color: var(--ui-primary); box-shadow: 0 0 0 1px var(--ui-primary); }
  .ui-field-error {
    grid-column: 1 / -1;
    color: var(--ui-primary);
    font-size: var(--ui-font-size-caption);
  }

  /* 自定义 Select；仅用于本地原型选项。 */
  .ui-select { position: relative; width: var(--ui-control-width-default); }
  .ui-select-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  /* ponytail: 下拉层与选项状态未采集；取得真实展开态后替换当前近似。 */
  .ui-select-menu {
    position: absolute;
    top: calc(100% + var(--ui-space-1));
    left: 0;
    z-index: 45;
    display: none;
    width: 100%;
    padding: var(--ui-space-1);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-control);
    background: var(--ui-bg);
    box-shadow: 0 8px 24px var(--ui-border-subtle);
  }
  .ui-select.is-open .ui-select-menu { display: block; }
  .ui-select-option {
    width: 100%;
    padding: 5px var(--ui-space-2);
    color: var(--ui-text);
    text-align: left;
    border: 0;
    border-radius: var(--ui-space-1);
    background: transparent;
  }
  .ui-select-option:hover, .ui-select-option[aria-selected="true"] {
    color: var(--ui-primary);
    background: var(--ui-bg-soft);
  }

  /* ponytail: 600px 为原型容错断点；取得真实窄屏布局证据后替换。 */
  @media (max-width: 600px) {
    .ui-form-grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<!-- 最小字段：label 与 input 分节点；placeholder 只写提示语，不含字段名。 -->
<div class="ui-form-grid" id="uiFormGrid">
  <label class="ui-field">
    <span class="ui-field-label">字段名称 <span class="ui-required" aria-hidden="true">*</span></span>
    <input class="ui-input" placeholder="请输入">
  </label>
  <div class="ui-field" id="uiFormFieldSelect">
    <span class="ui-field-label">选择项</span>
    <div class="ui-select" data-ui-select>
      <button class="ui-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span data-ui-select-value>请选择</span><span aria-hidden="true">⌄</span>
      </button>
      <div class="ui-select-menu" role="listbox">
        <button class="ui-select-option" type="button" role="option" aria-selected="false">选项一</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* 切换 Select 展开状态并同步可访问属性。 */
  function toggleUiSelect(select, forceOpen) {
    const trigger = select.querySelector('.ui-select-trigger');
    const isOpen = typeof forceOpen === 'boolean' ? forceOpen : !select.classList.contains('is-open');
    select.classList.toggle('is-open', isOpen);
    trigger.setAttribute('aria-expanded', String(isOpen));
  }

  /* 处理 Select 展开、选择和点击外部关闭。 */
  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('.ui-select-trigger');
    if (trigger) toggleUiSelect(trigger.closest('[data-ui-select]'));
    const option = event.target.closest('.ui-select-option');
    if (option) {
      const select = option.closest('[data-ui-select]');
      select.querySelector('[data-ui-select-value]').textContent = option.textContent;
      select.querySelectorAll('.ui-select-option').forEach((item) => {
        item.setAttribute('aria-selected', String(item === option));
      });
      toggleUiSelect(select, false);
      select.querySelector('.ui-select-trigger').focus();
    }
    if (!event.target.closest('[data-ui-select]')) {
      document.querySelectorAll('[data-ui-select].is-open').forEach((select) => toggleUiSelect(select, false));
    }
  });

  /* 支持 Escape 关闭所有展开的 Select。 */
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    document.querySelectorAll('[data-ui-select].is-open').forEach((select) => toggleUiSelect(select, false));
  });
</script>
